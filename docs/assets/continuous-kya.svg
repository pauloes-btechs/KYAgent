', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0" opacity="1">REVOKED</text><text x="1155" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#B8C4C2" text-anchor="middle" letter-spacing="0" opacity="1">terminal</text><path d="M250,392 C300,300 380,280 440,288" fill="none" stroke="#889397" stroke-width="1.5" marker-end="url(#arr)"/><text x="318" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5C6C75" text-anchor="middle" letter-spacing="0" opacity="1">investigation → REVIEW</text><path d="M440,316 C380,330 300,370 252,404" fill="none" stroke="#889397" stroke-width="1.5" marker-end="url(#arr)"/><text x="362" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5C6C75" text-anchor="middle" letter-spacing="0" opacity="1">admin clears</text><path d="M250,430 C320,470 380,510 440,516" fill="none" stroke="#016BF8" stroke-width="1.5" marker-end="url(#arr)"/><text x="392" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5C6C75" text-anchor="middle" letter-spacing="0" opacity="1">change stream</text><path d="M440,546 C340,582 250,545 222,446" fill="none" stroke="#889397" stroke-width="1.5" marker-end="url(#arr)"/><text x="250" y="590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5C6C75" text-anchor="middle" letter-spacing="0" opacity="1">re-screen → ALLOW</text><path d="M515,326 L515,498" fill="none" stroke="#016BF8" stroke-width="1.5" marker-end="url(#arr)"/><path d="M555,498 L555,326" fill="none" stroke="#889397" stroke-width="1.5" marker-end="url(#arr)"/><text x="505" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#016BF8" text-anchor="end" letter-spacing="0" opacity="1">watcher</text><text x="566" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5C6C75" text-anchor="start" letter-spacing="0" opacity="1">re-screen → REVIEW</text><path d="M630,294 C720,300 780,340 840,388" fill="none" stroke="#C52B2B" stroke-width="1.5" marker-end="url(#arrr)"/><text x="742" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5C6C75" text-anchor="middle" letter-spacing="0" opacity="1">confirmed bad outcome</text><path d="M630,530 C720,520 790,470 850,440" fill="none" stroke="#C52B2B" stroke-width="1.5" marker-end="url(#arrr)"/><text x="760" y="524" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5C6C75" text-anchor="middle" letter-spacing="0" opacity="1">re-screen → BLOCK</text><path d="M250,412 C420,412 640,412 830,412" fill="none" stroke="#C52B2B" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrr)"/><text x="690" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5C6C75" text-anchor="middle" letter-spacing="0" opacity="1">exact sanctions match</text><path d="M1020,412 L1080,412" fill="none" stroke="#1C2D38" stroke-width="1.5" marker-end="url(#arr)"/><text x="1050" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-