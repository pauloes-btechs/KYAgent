<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 610" width="1280" height="610" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#889397"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00684A"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C52B2B"/></marker></defs><rect width="1280" height="610" fill="#F9FBFA" rx="0"/><text x="48" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#00684A" text-anchor="start" letter-spacing="1.6" opacity="1">CONTINUOUS KNOW-YOUR-AGENT</text><text x="48" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1C2D38" text-anchor="start" letter-spacing="0" opacity="1">Trust is re-evaluated when the world changes, not only when an agent asks</text><text x="48" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#5C6C75" text-anchor="start" letter-spacing="0" opacity="1">A MongoDB change stream on the sanctions collection re-screens affected agents and moves their passports without any request in flight.</text><rect x="40" y="140" width="280" height="70" rx="10" fill="#FFFFFF" stroke="#E1E7EA" stroke-width="1" opacity="1"/><rect x="40" y="140" width="4" height="70" rx="2" fill="#00684A"/><text x="60" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1C2D38" text-anchor="start" letter-spacing="0" opacity="1">Sanctions delta inserted</text><text x="60" y="192" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#5C6C75" text-anchor="start" letter-spacing="0" opacity="1">sanctions / sanctions_updates</text><line x1="320" y1="175" x2="340" y2="175" stroke="#889397" stroke-width="1.5" marker-end="url(#arr)"/><rect x="340" y="140" width="280" height="70" rx="10" fill="#FFFFFF" stroke="#E1E7EA" stroke-width="1" opacity="1"/><rect x="340" y="140" width="4" height="70" rx="2" fill="#00684A"/><text x="360" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1C2D38" text-anchor="start" letter-spacing="0" opacity="1">Change stream event</text><text x="360" y="192" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#5C6C75" text-anchor="start" letter-spacing="0" opacity="1">resumable via watcher_state</text><line x1="620" y1="175" x2="640" y2="175" stroke="#889397" stroke-width="1.5" marker-end="url(#arr)"/><rect x="640" y="140" width="280" height="70" rx="10" fill="#FFFFFF" stroke="#E1E7EA" stroke-width="1" opacity="1"/><rect x="640" y="140" width="4" height="70" rx="2" fill="#00684A"/><text x="660" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1C2D38" text-anchor="start" letter-spacing="0" opacity="1">Re-screen ACTIVE / REVIEW agents</text><text x="660" y="192" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#5C6C75" text-anchor="start" letter-spacing="0" opacity="1">exact wallet + $search</text><line x1="920" y1="175" x2="940" y2="175" stroke="#889397" stroke-width="1.5" marker-end="url(#arr)"/><rect x="940" y="140" width="280" height="70" rx="10" fill="#FFFFFF" stroke="#E1E7EA" stroke-width="1" opacity="1"/><rect x="940" y="140" width="4" height="70" rx="2" fill="#00684A"/><text x="960" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1C2D38" text-anchor="start" letter-spacing="0" opacity="1">Passport transition + receipt</text><text x="960" y="192" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" fill="#5C6C75" text-anchor="start" letter-spacing="0" opacity="1">audited, visible on next /verify</text><rect x="60" y="380" width="190" height="64" rx="32" fill="#E3FCF7" stroke="#00A35C" stroke-width="1.5" opacity="1"/><text x="155.0" y="409" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#00A35C" text-anchor="middle" letter-spacing="0" opacity="1">ACTIVE</text><text x="155.0" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5C6C75" text-anchor="middle" letter-spacing="0" opacity="1">trusted within delegation</text><rect x="440" y="262" width="190" height="64" rx="32" fill="#FFF8E1" stroke="#946F01" stroke-width="1.5" opacity="1"/><text x="535.0" y="291" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#946F01" text-anchor="middle" letter-spacing="0" opacity="1">REVIEW</text><text x="535.0" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#5C6C75" text-anchor="middle" letter-spacing="0" opacity="1">human review pending</text><rect x="440" y="498" width="190"