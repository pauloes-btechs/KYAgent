# Local stack (REQ-020): MongoDB -> one-shot migrations -> API (+ optional seed).
# Secrets come from an untracked .env file (`npm run env:init` generates one from
# .env.example); nothing secret lives in this file.
#
#   npm run env:init                               # once: writes .env (git-ignored, 0600)
#   docker compose up --build -d                   # mongo, migrate, api
#   docker compose --profile seed run --rm seed    # optional demo data (prints keys once)
#   docker compose down                            # add -v to wipe the database volume
x-kyagent: &kyagent
  build: .
  image: kyagent:local
  env_file: .env
  environment:
    NODE_ENV: production
    MONGODB_URI: mongodb://mongo:27017
    MONGODB_DB: kyagent

services:
  mongo:
    image: mongo:7
    # Not published on the host: only the API containers reach it.
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *kyagent
    command: ["node", "scripts/migrate.js"]
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  api:
    <<: *kyagent
    command: ["node", "src/server.js"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  seed:
    <<: *kyagent
    profiles: ["seed"]
    command: ["node", "scripts/seed.js", "--allow-production"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  mongo-data:
